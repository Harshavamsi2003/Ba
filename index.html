<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#5A48C6" />

    <!-- title, description, canonical, robots and og:title/description/url are
         intentionally NOT set here — every route (including "/") sets its own
         correct version via the <SEO> component (src/components/SEO.jsx),
         rendered through react-helmet-async. Keeping them here too used to
         cause real duplicate/conflicting tags in the live DOM: two competing
         <link rel="canonical"> tags and two competing <meta name="description">
         tags on every non-home page, confirmed by inspecting the rendered
         output — a genuine cause of indexing confusion in Search Console.
         Only tags that never change per route stay static below. -->
    <title>Baby Blossom Naturopathy | Fertility & Wellness Clinic, Chennai</title>
    <meta name="keywords" content="naturopathy Chennai, fertility clinic Chennai, PMOS management, holistic fertility care, preconception care, Dr.C Vidya, Baby Blossom" />
    <meta name="author" content="Baby Blossom Naturopathy Fertility & Wellness Clinic" />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.babyblossomfertility.in/og-image.png" />
    <meta property="og:site_name" content="Baby Blossom Naturopathy" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.babyblossomfertility.in/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalClinic",
      "name": "Baby Blossom Naturopathy Fertility & Wellness Clinic",
      "@id": "https://www.babyblossomfertility.in/#clinic",
      "url": "https://www.babyblossomfertility.in/",
      "image": "https://www.babyblossomfertility.in/og-image.png",
      "description": "Holistic, natural, evidence-based fertility and wellness care in Chennai.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "9/31, Sabari Avenue, Ottiyambakkam Main Road, Sithalapakkam",
        "addressLocality": "Chennai",
        "addressRegion": "Tamil Nadu",
        "postalCode": "600131",
        "addressCountry": "IN"
      },
      "telephone": "+91-99940-54290",
      "founder": { "@type": "Person", "name": "Dr.C Vidya" },
      "medicalSpecialty": "Naturopathy, Fertility & Women's Wellness",
      "areaServed": "Chennai, Tamil Nadu",
      "priceRange": "₹₹",
      "openingHours": "Mo-Sa 09:00-19:00"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
